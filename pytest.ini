; Configuracion de la suite (Stage 2 del Entregable 3)
;
; `pythonpath` evita tener que instalar el proyecto como paquete: los modulos de
; mlops_pipeline/ se importan por su nombre, igual que hacen entre ellos.
;
; La cobertura se mide sobre mlops_pipeline/ y se escribe en coverage.xml, que es
; el formato que SonarCloud lee. El termino en consola es para quien corre la
; suite a mano.

[pytest]
testpaths = tests
pythonpath = mlops_pipeline tests
python_files = test_*.py
python_functions = test_*

addopts =
    --strict-markers
    --cov=mlops_pipeline
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    -ra

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
