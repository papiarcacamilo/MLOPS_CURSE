# =============================================================================
# SonarCloud | MLOPS_CURSE
# =============================================================================
#
# QUE PIDE LA ENTREGA 3
#
#   Stage 2: "calidad, seguridad, cobertura, integridad y estilo".
#
# Los tests responden por la cobertura; Sonar, por las otras cuatro.
#
# Gratuito porque el repositorio es publico. Para uno privado haria falta plan
# de pago, y ese fue uno de los motivos para dejarlo publico.
# =============================================================================

sonar.projectKey=papiarcacamilo_MLOPS_CURSE
sonar.organization=papiarcacamilo
sonar.projectName=MLOPS_CURSE - Riesgo crediticio
sonar.projectVersion=2.0.0

# --- Que se analiza ---------------------------------------------------------
sonar.sources=mlops_pipeline
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Los notebooks quedan fuera del analisis. Sonar los lee como JSON, no como
# codigo, y produciria ruido sobre celdas de salida que nadie mantiene.
sonar.exclusions=**/*.ipynb,**/__pycache__/**,data/**

# --- Cobertura --------------------------------------------------------------
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# El propio codigo de test no cuenta para la cobertura: medirla sobre si mismo
# infla el numero sin decir nada del codigo que se entrega.
sonar.coverage.exclusions=tests/**,**/*.ipynb

# --- Duplicacion ------------------------------------------------------------
# Los tests repiten estructura por disenio (arrange, act, assert), y marcarlos
# como duplicados esconderia la duplicacion real del codigo de produccion.
sonar.cpd.exclusions=tests/**
